<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Khung ảnh Nhà Hàng Chay An Tịnh</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#140b05;color:#f5dfad;font-family:Arial,sans-serif;text-align:center}
.wrap{max-width:900px;margin:auto;padding:18px}
h1{font-size:23px;margin:4px 0 8px}
p{margin:0 0 14px}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:15px}
label,button{border:1px solid #c99b48;background:#2a1709;color:#ffe5a2;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:15px}
input{display:none}
.stage{position:relative;width:min(94vw,850px);aspect-ratio:1/1;margin:auto;overflow:hidden}
#photoCanvas,#frame{position:absolute;inset:0;width:100%;height:100%}
#photoCanvas{z-index:1}
#frame{z-index:2;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
<h1>Khung ảnh Nhà Hàng Chay An Tịnh</h1>
<p>Ảnh khách được phủ kín toàn bộ vùng ảnh trung tâm.</p>
<div class="controls">
<label>📷 Chọn ảnh<input id="file" type="file" accept="image/*"></label>
<button id="save">⬇ Tải ảnh đã ghép</button>
</div>
<div class="stage">
<canvas id="photoCanvas" width="1254" height="1254"></canvas>
<img id="frame" src="an-tinh-frame.png" alt="Khung An Tịnh">
</div>
</div>
<script>
const W=1254, H=1254;
const cx=W/2, cy=650, rx=414, ry=394;
const canvas=document.getElementById('photoCanvas');
const ctx=canvas.getContext('2d');
let selected=null;

function drawPlaceholder(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,W,H);
}
drawPlaceholder();

document.getElementById('file').addEventListener('change',e=>{
  const file=e.target.files[0];
  if(!file)return;
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{
    selected=img;
    ctx.clearRect(0,0,W,H);
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
    ctx.clip();

    // Cover the entire upload opening (no white/checkerboard band).
    const scale=Math.max((2*rx)/img.width,(2*ry)/img.height);
    const dw=img.width*scale, dh=img.height*scale;
    ctx.drawImage(img,cx-dw/2,cy-dh/2,dw,dh);
    ctx.restore();
    URL.revokeObjectURL(url);
  };
  img.src=url;
});

document.getElementById('save').addEventListener('click',()=>{
  if(!selected){alert('Vui lòng chọn ảnh trước.');return;}
  const out=document.createElement('canvas');
  out.width=W;out.height=H;
  const o=out.getContext('2d');
  o.drawImage(canvas,0,0);
  const f=new Image();
  f.onload=()=>{
    o.drawImage(f,0,0);
    const a=document.createElement('a');
    a.download='an-tinh-khung-anh.png';
    a.href=out.toDataURL('image/png');
    a.click();
  };
  f.src='an-tinh-frame.png';
});
</script>
</body>
</html>
