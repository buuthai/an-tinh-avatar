<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tạo ảnh cùng An Tịnh</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4eee4;color:#3d2917;font-family:Arial,sans-serif}
.app{max-width:920px;margin:auto;padding:16px}
h1{text-align:center;font-size:23px;margin:4px 0 6px}
.sub{text-align:center;margin:0 0 15px;color:#6b5740}
.panel{background:#fff;border:1px solid #ddcba9;border-radius:14px;padding:14px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.controls{display:grid;gap:10px}
.file-btn,button{border:1px solid #b78a3d;background:#fff5df;color:#53340e;border-radius:9px;padding:11px 15px;font-size:15px;cursor:pointer}
.file-btn{display:block;text-align:center}
input[type=file]{display:none}
.slider{display:grid;grid-template-columns:125px 1fr 58px;gap:8px;align-items:center;font-size:13px}
input[type=range]{width:100%;accent-color:#b78a3d}
.stage{position:relative;width:min(96vw,850px);aspect-ratio:1/1;margin:16px auto;overflow:hidden;background:#fff}
#photo,#frame{position:absolute;inset:0;width:100%;height:100%}
#photo{z-index:1} #frame{z-index:2;pointer-events:none}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#status{text-align:center;min-height:20px;margin-top:9px;font-size:13px;color:#765a32}
</style>
</head>
<body>
<div class="app">
<h1>Tạo Ảnh Cùng An Tịnh</h1>
<p class="sub">Ảnh khách tải lên sẽ thay đổi trực tiếp trong khung — không có ảnh mẫu cố định.</p>
<div class="panel">
<div class="controls">
<label class="file-btn">📷 TẢI ẢNH CỦA BẠN LÊN
<input id="file" type="file" accept="image/jpeg,image/png,image/webp">
</label>

<div class="slider"><span>Phóng to / nhỏ</span><input id="zoom" type="range" min="50" max="220" value="100"><output id="zv">100%</output></div>
<div class="slider"><span>Dịch trái / phải</span><input id="x" type="range" min="-220" max="220" value="0"><output id="xv">0</output></div>
<div class="slider"><span>Dịch lên / xuống</span><input id="y" type="range" min="-220" max="220" value="0"><output id="yv">0</output></div>
</div>

<div class="stage">
<canvas id="photo" width="1254" height="1254"></canvas>
<img id="frame" src="an-tinh-frame.png" alt="Khung An Tịnh">
</div>

<div class="actions">
<button id="reset">↺ Đặt lại</button>
<button id="download">⬇ TẢI ẢNH XUỐNG</button>
<button id="share">📤 LƯU / CHIA SẺ</button>
</div>
<div id="status"></div>
</div>
</div>

<script>
const W=1254,H=1254,CX=627,CY=645,R=393;
const c=document.getElementById('photo'),ctx=c.getContext('2d');
const file=document.getElementById('file'),zoom=document.getElementById('zoom'),xs=document.getElementById('x'),ys=document.getElementById('y');
const zv=document.getElementById('zv'),xv=document.getElementById('xv'),yv=document.getElementById('yv'),status=document.getElementById('status');
let photo=null,ready=false;

function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
 if(!photo)return;
 ctx.save();
 ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.clip();
 const scale=Math.max(2*R/photo.width,2*R/photo.height)*Number(zoom.value)/100;
 const dw=photo.width*scale,dh=photo.height*scale;
 ctx.drawImage(photo,CX-dw/2+Number(xs.value),CY-dh/2+Number(ys.value),dw,dh);
 ctx.restore();
 zv.textContent=zoom.value+'%';xv.textContent=xs.value;yv.textContent=ys.value;
}
draw();

file.onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const u=URL.createObjectURL(f),img=new Image();
 status.textContent='Đang tải ảnh...';
 img.onload=()=>{
  photo=img;ready=true;zoom.value=100;xs.value=0;ys.value=0;draw();
  status.textContent='Ảnh đã được tải lên. Bạn có thể chỉnh kích thước và vị trí.';
  URL.revokeObjectURL(u);
 };
 img.onerror=()=>{status.textContent='Không đọc được ảnh. Vui lòng chọn JPG, PNG hoặc WebP.';URL.revokeObjectURL(u);};
 img.src=u;
};

[zoom,xs,ys].forEach(el=>el.oninput=draw);
document.getElementById('reset').onclick=()=>{zoom.value=100;xs.value=0;ys.value=0;draw();};

async function finalCanvas(){
 const out=document.createElement('canvas');out.width=W;out.height=H;
 const o=out.getContext('2d');o.drawImage(c,0,0);
 const fr=new Image();
 await new Promise((resolve,reject)=>{fr.onload=resolve;fr.onerror=reject;fr.src='an-tinh-frame.png';});
 o.drawImage(fr,0,0);
 return out;
}

document.getElementById('download').onclick=async()=>{
 if(!ready){status.textContent='Vui lòng tải ảnh lên trước.';return;}
 status.textContent='Đang tạo ảnh...';
 try{
  const out=await finalCanvas();
  out.toBlob(blob=>{
   const u=URL.createObjectURL(blob),a=document.createElement('a');
   a.href=u;a.download='an-tinh-khung-anh.png';document.body.appendChild(a);a.click();
   setTimeout(()=>{a.remove();URL.revokeObjectURL(u);},4000);
   status.textContent='Đã tải ảnh. Trên máy tính, ảnh nằm trong thư mục Downloads/Tải xuống.';
  },'image/png');
 }catch(e){status.textContent='Không tạo được ảnh. Hãy thử lại.';}
};

document.getElementById('share').onclick=async()=>{
 if(!ready){status.textContent='Vui lòng tải ảnh lên trước.';return;}
 try{
  const out=await finalCanvas();
  out.toBlob(async blob=>{
   const f=new File([blob],'an-tinh-khung-anh.png',{type:'image/png'});
   if(navigator.share && (!navigator.canShare || navigator.canShare({files:[f]}))){
    await navigator.share({title:'Khung ảnh An Tịnh',files:[f]});
    status.textContent='Đã mở menu chia sẻ của thiết bị.';
   }else{
    const u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u;a.download='an-tinh-khung-anh.png';document.body.appendChild(a);a.click();
    setTimeout(()=>{a.remove();URL.revokeObjectURL(u);},4000);
    status.textContent='Ảnh đã được tải xuống.';
   }
  },'image/png');
 }catch(e){if(e.name!=='AbortError')status.textContent='Không thể chia sẻ. Hãy dùng Tải ảnh xuống.';}
};
</script>
</body>
</html>
