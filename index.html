<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Khung ảnh An Tịnh</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#eee;color:#382512;font-family:Arial,sans-serif;text-align:center}
main{max-width:900px;margin:auto;padding:18px} h1{font-size:22px} p{margin:8px 0 16px}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
label,button{padding:10px 17px;border:1px solid #b88a38;border-radius:8px;background:#fff6df;color:#55350f;cursor:pointer}
input{display:none} .stage{position:relative;width:min(94vw,850px);aspect-ratio:1;margin:16px auto;overflow:hidden}
canvas,img{position:absolute;inset:0;width:100%;height:100%} canvas{z-index:1} img{z-index:2;pointer-events:none}
</style></head>
<body><main>
<h1>Khung ảnh Nhà Hàng Chay An Tịnh</h1>
<p>Chọn ảnh khách để đặt vào vùng trung tâm.</p>
<div class="controls">
<label>📷 Chọn ảnh<input id="file" type="file" accept="image/*"></label>
<button id="save">⬇ Tải ảnh đã ghép</button>
</div>
<div class="stage"><canvas id="photo" width="1254" height="1254"></canvas><img src="an-tinh-frame.png" alt="Khung An Tịnh"></div>
</main>
<script>
const W=1254,H=1254,CX=W/2,CY=700,RX=315,RY=315;
const c=document.getElementById('photo'),ctx=c.getContext('2d'); let ready=false;
ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
document.getElementById('file').onchange=e=>{
 const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{ctx.clearRect(0,0,W,H);ctx.save();ctx.beginPath();ctx.ellipse(CX,CY,RX,RY,0,0,Math.PI*2);ctx.clip();
 const s=Math.max(2*RX/im.width,2*RY/im.height),dw=im.width*s,dh=im.height*s;
 ctx.drawImage(im,CX-dw/2,CY-dh/2,dw,dh);ctx.restore();ready=true;URL.revokeObjectURL(u);};im.src=u;
};
document.getElementById('save').onclick=()=>{
 if(!ready)return alert('Vui lòng chọn ảnh trước.');
 const o=document.createElement('canvas');o.width=W;o.height=H;const x=o.getContext('2d');x.drawImage(c,0,0);
 const f=new Image();f.onload=()=>{x.drawImage(f,0,0);const a=document.createElement('a');a.download='an-tinh-khung-anh.png';a.href=o.toDataURL('image/png');a.click();};f.src='an-tinh-frame.png';
};
</script></body></html>
