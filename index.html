<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Khung ảnh Nhà Hàng Chay An Tịnh</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#120b05}
body{min-height:100vh;display:grid;place-items:center;padding:16px}
.frame-wrap{position:relative;width:min(96vw,1000px);aspect-ratio:1/1;overflow:hidden}
.photo,.frame{position:absolute;inset:0;width:100%;height:100%}
.photo{object-fit:cover}
.frame{object-fit:contain;pointer-events:none}
</style>
</head>
<body>
<div class="frame-wrap">
  <img class="photo" src="photo.jpg" alt="Ảnh khách">
  <img class="frame" src="an-tinh-frame.png" alt="Khung ảnh An Tịnh">
</div>
</body>
</html>
