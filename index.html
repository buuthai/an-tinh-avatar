<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ảnh đại diện An Tịnh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>ẢNH ĐẠI DIỆN AN TỊNH</h1>
      <p>Tạo ảnh đại diện với khung chính thức của Nhà Hàng Chay An Tịnh</p>
    </header>

    <section class="card">
      <label class="upload-btn" for="photoInput">📷 CHỌN ẢNH CỦA BẠN</label>
      <input id="photoInput" type="file" accept="image/*">

      <div class="preview">
        <canvas id="canvas" width="1080" height="1080"></canvas>
      </div>

      <div class="tools">
        <label for="zoom">Phóng to / thu nhỏ</label>
        <input id="zoom" type="range" min="0.5" max="2.5" value="1" step="0.01">

        <div class="buttons">
          <button id="resetBtn" class="secondary">↺ CĂN LẠI</button>
          <button id="downloadBtn">⬇ TẢI ẢNH ĐẠI DIỆN</button>
        </div>
      </div>

      <p class="note">
        Sau khi chọn ảnh, kéo ảnh để căn chỉnh khuôn mặt và dùng thanh bên trên để phóng to/thu nhỏ.
      </p>
    </section>

    <footer>
      <strong>NHÀ HÀNG CHAY AN TỊNH</strong>
      <span>Chay Thuần Khiết - Tâm An Lành - Thân Thanh Tịnh</span>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
