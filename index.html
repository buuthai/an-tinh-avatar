<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tạo ảnh đại diện – Nhà Hàng Chay An Tịnh</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#17100a;color:#f7e8c2}
.wrap{max-width:760px;margin:auto;padding:18px 14px 34px}
h1{text-align:center;font-size:24px;margin:8px 0 4px}
.sub{text-align:center;opacity:.85;font-size:14px;margin-bottom:16px}
.card{background:#24170d;border:1px solid #7b5524;border-radius:18px;padding:16px;box-shadow:0 12px 35px #0008}
.controls{display:grid;gap:10px}
button,.upload{border:0;border-radius:12px;padding:13px 15px;font-weight:700;font-size:15px;cursor:pointer}
.upload{display:block;text-align:center;background:#d7a94d;color:#211306}
button{background:#f0c76a;color:#211306}
button.secondary{background:#4b351d;color:#f7e8c2}
input[type=file]{display:none}
input[type=range]{width:100%}
.preview{display:flex;justify-content:center;margin:15px 0}
canvas{width:min(92vw,560px);height:min(92vw,560px);border-radius:50%;background:#0c0906;box-shadow:0 0 0 1px #a9762e,0 10px 35px #000b;touch-action:none}
.note{text-align:center;font-size:12px;opacity:.7;margin-top:10px;line-height:1.45}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.small{font-size:13px;opacity:.9}
</style>
</head>
<body>
<div class="wrap">
  <h1>ẢNH ĐẠI DIỆN AN TỊNH</h1>
  <div class="sub">Tải ảnh của bạn lên • Căn chỉnh • Tải ảnh đại diện có khung</div>
  <div class="card">
    <div class="controls">
      <label class="upload" for="file">📷 Chọn ảnh từ điện thoại / máy tính</label>
      <input id="file" type="file" accept="image/*">
      <div class="preview"><canvas id="canvas" width="1080" height="1080"></canvas></div>
      <label class="small">Phóng to / thu nhỏ</label>
      <input id="zoom" type="range" min="0.5" max="2.5" step="0.01" value="1">
      <div class="row">
        <button class="secondary" id="reset">↺ Căn lại</button>
        <button id="download">⬇ Tải ảnh đại diện</button>
      </div>
    </div>
    <div class="note">Bạn có thể kéo ảnh trực tiếp trên khung để căn khuôn mặt. Ảnh xuất ra dạng PNG vuông, phù hợp làm ảnh đại diện Zalo.</div>
  </div>
</div>

<script>
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
const file=document.getElementById('file'), zoom=document.getElementById('zoom');
const frame=new Image(); frame.src='khung_an_tinh.png';
let photo=null, scale=1, ox=0, oy=0, dragging=false, sx=0, sy=0, startX=0, startY=0;

function draw(){
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.beginPath();ctx.arc(W/2,H/2,W/2-4,0,Math.PI*2);ctx.clip();
  ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);
  if(photo){
    const base=Math.max(W/photo.width,H/photo.height);
    const s=base*scale;
    const dw=photo.width*s, dh=photo.height*s;
    ctx.drawImage(photo,(W-dw)/2+ox,(H-dh)/2+oy,dw,dh);
  }
  ctx.restore();
  ctx.drawImage(frame,0,0,W,H);
}
frame.onload=draw;

file.onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{photo=im;scale=1;ox=0;oy=0;zoom.value=1;draw()};im.src=r.result};
  r.readAsDataURL(f);
};
zoom.oninput=()=>{scale=+zoom.value;draw()};
document.getElementById('reset').onclick=()=>{scale=1;ox=0;oy=0;zoom.value=1;draw()};

function point(e){
  const r=canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)*(canvas.width/r.width),y:(e.clientY-r.top)*(canvas.height/r.height)};
}
canvas.addEventListener('pointerdown',e=>{
  if(!photo)return;
  dragging=true; canvas.setPointerCapture(e.pointerId);
  const p=point(e); sx=p.x;sy=p.y;startX=ox;startY=oy;
});
canvas.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const p=point(e);ox=startX+p.x-sx;oy=startY+p.y-sy;draw();
});
canvas.addEventListener('pointerup',()=>dragging=false);
canvas.addEventListener('pointercancel',()=>dragging=false);

document.getElementById('download').onclick=()=>{
  if(!photo){alert('Vui lòng chọn ảnh trước.');return}
  const a=document.createElement('a');
  a.download='anh-dai-dien-An-Tinh.png';
  a.href=canvas.toDataURL('image/png');
  a.click();
};
</script>
</body>
</html>
