<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Khung ảnh An Tịnh</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#160d06;color:#f8e6bf;font-family:Arial,sans-serif;text-align:center}
.wrap{max-width:900px;margin:auto;padding:20px}
h1{font-size:24px;margin:8px 0 6px}
p{margin:6px 0 16px;color:#e6cf9f}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
button,.file-label{border:1px solid #c9983e;background:#2a1709;color:#ffe7a7;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:15px}
button:hover,.file-label:hover{background:#41240e}
input{display:none}
.stage{position:relative;width:min(92vw,800px);aspect-ratio:1/1;margin:auto;overflow:hidden}
#photoCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}
#frame{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.hint{font-size:13px;margin-top:12px;opacity:.8}
</style>
</head>
<body>
<div class="wrap">
<h1>Khung ảnh Nhà Hàng Chay An Tịnh</h1>
<p>Chọn ảnh của khách — ảnh sẽ tự động nằm trong vùng tròn trung tâm.</p>
<div class="controls">
<label class="file-label">📷 Chọn ảnh<input id="file" type="file" accept="image/*"></label>
<button id="download">⬇ Tải ảnh đã ghép</button>
</div>
<div class="stage">
<canvas id="photoCanvas" width="1254" height="1254"></canvas>
<img id="frame" src="an-tinh-frame.png" alt="Khung An Tịnh">
</div>
<div class="hint">Khung và logo nằm phía trên; không có chi tiết trang trí nào phủ lên ảnh khách.</div>
</div>
<script>
const fileInput=document.getElementById('file');
const canvas=document.getElementById('photoCanvas');
const ctx=canvas.getContext('2d');
const download=document.getElementById('download');
const W=1254,H=1254;
const cx=W/2, cy=H/2+8, r=Math.min(W,H)*0.307;

function drawPlaceholder(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#ffffff";
  ctx.fillRect(0,0,W,H);
}
drawPlaceholder();

fileInput.addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f)return;
  const url=URL.createObjectURL(f);
  const img=new Image();
  img.onload=()=>{
    ctx.clearRect(0,0,W,H);
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.clip();

    // Cover: ảnh lấp đầy toàn bộ vùng tròn, không để viền trắng.
    const scale=Math.max((r*2)/img.width,(r*2)/img.height);
    const dw=img.width*scale, dh=img.height*scale;
    ctx.drawImage(img,cx-dw/2,cy-dh/2,dw,dh);
    ctx.restore();
    URL.revokeObjectURL(url);
  };
  img.src=url;
});

download.addEventListener('click',()=>{
  // Ghép canvas ảnh khách + PNG khung thành một ảnh cuối.
  const out=document.createElement('canvas');
  out.width=W; out.height=H;
  const o=out.getContext('2d');
  o.drawImage(canvas,0,0,W,H);
  const frameImg=new Image();
  frameImg.onload=()=>{
    o.drawImage(frameImg,0,0,W,H);
    const a=document.createElement('a');
    a.download='an-tinh-khung-anh.png';
    a.href=out.toDataURL('image/png');
    a.click();
  };
  frameImg.src='an-tinh-frame.png';
});
</script>
</body>
</html>
